name: Deploy Website Heo Quay Thanh Tung

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Cho phép kích hoạt chạy deploy thủ công trên GitHub

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  # 1. Kiểm tra mã nguồn (Linting / Validation)
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate HTML
        uses: CybozuLab/html5validate-action@v1
        continue-on-error: true # Tiếp tục quy trình nếu chỉ gặp cảnh báo nhỏ

  # 2. Xuất bản lên GitHub Pages
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
